spring:
  application:
    name: mobile-badge-mgmt
  datasource:
    url: jdbc:h2:file:./data/mobilebadge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: 8092
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        name: MBSESSION
        path: /

app:
  storage:
    root: ./data/objects
  seed:
    enabled: true
